name: Research and data contract verification
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: backtest
          POSTGRES_PASSWORD: ephemeral-test-only
          POSTGRES_DB: backtest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U backtest -d backtest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BACKTEST_TEST_DATABASE_URL: postgresql+psycopg://backtest:ephemeral-test-only@localhost:5432/backtest_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.13'
      - name: Install pinned research and data dependencies
        run: python -m pip install '.[research]' pytest==8.4.2
      - name: Verify actual framework, immutable inputs, API and SQL contracts
        run: >-
          python -m pytest tests/unit/test_research_*.py
          tests/unit/test_calendar_source.py tests/unit/test_coverage_eligibility.py
          tests/unit/test_github_setup.py
          tests/integration/test_research_engine.py
          tests/integration/test_research_projection_sql.py
          tests/integration/test_coverage_eligibility_sql.py
          --require-postgres -q --junitxml=verification.xml
      - name: Verify provider Secrets are configured (manual trusted run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          BACKTEST_SEC_USER_AGENT: ${{ secrets.BACKTEST_SEC_USER_AGENT }}
        run: |
          python - <<'PY'
          import os,json
          names=('KIS_APP_KEY','KIS_APP_SECRET','OPENDART_API_KEY','APCA_API_KEY_ID','APCA_API_SECRET_KEY','KRX_API_KEY','ALPHA_VANTAGE_API_KEY','BACKTEST_SEC_USER_AGENT')
          checks={name:bool(os.environ.get(name)) for name in names}
          print(json.dumps({'secret_names_configured':checks,'provider_requests_performed':False}))
          if not all(checks.values()): raise SystemExit('Provider configuration incomplete')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify and build research UI
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Save bounded public verification result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-verification
          path: verification.xml
          retention-days: 7
