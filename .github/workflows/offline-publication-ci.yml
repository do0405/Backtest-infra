name: Offline publication recovery verification
on:
  push:
    branches: [main]
    paths:
      - 'scripts/offline*'
      - 'scripts/build_offline_runtime.py'
      - 'scripts/collection_runtime.py'
      - 'scripts/extra-runtime.json'
      - 'scripts/retry_release_asset.py'
      - 'tests/unit/test_remote_releases.py'
      - 'tests/unit/test_remote_schedule.py'
      - 'tests/unit/test_remote_paced_publication.py'
      - 'tests/unit/test_offline*'
      - 'tests/runtime/**'
      - 'scripts/extra-task-archive-v9.patch'
      - 'scripts/remote_extended_launcher.py'
      - '.github/workflows/offline*'
      - '.github/workflows/collection-maintenance.yml'
      - '.github/workflows/remote-extended-refresh.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'scripts/offline*'
      - 'scripts/build_offline_runtime.py'
      - 'scripts/collection_runtime.py'
      - 'scripts/extra-runtime.json'
      - 'scripts/retry_release_asset.py'
      - 'tests/unit/test_remote_releases.py'
      - 'tests/unit/test_remote_schedule.py'
      - 'tests/unit/test_remote_paced_publication.py'
      - 'tests/unit/test_offline*'
      - 'tests/runtime/**'
      - 'scripts/extra-task-archive-v9.patch'
      - 'scripts/remote_extended_launcher.py'
      - '.github/workflows/offline*'
      - '.github/workflows/collection-maintenance.yml'
      - '.github/workflows/remote-extended-refresh.yml'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build and verify both published runtime pins
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://github.com/do0405/Backtest-infra/releases/download/offline-core-runtime-v6-20261031/runtime.zip \
            -o "$RUNNER_TEMP/core-base.zip"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://github.com/do0405/Backtest-infra/releases/download/extra-task-archive-v8-20261014-94adf2ef27ae/runtime.zip \
            -o "$RUNNER_TEMP/extra-base.zip"
          python scripts/build_offline_runtime.py --stream core --base "$RUNNER_TEMP/core-base.zip" \
            --output "$RUNNER_TEMP/core.zip" --verify-and-extract "$RUNNER_TEMP/core" --verify-published
          python scripts/build_offline_runtime.py --stream extra --base "$RUNNER_TEMP/extra-base.zip" \
            --output "$RUNNER_TEMP/extra.zip" --verify-and-extract "$RUNNER_TEMP/extra" --verify-published
      - name: Install verification dependencies
        run: python -m pip install . pytest==8.4.2 cryptography==50.0.2 cffi==2.1.1 pycparser==3.0
      - name: Verify Extra runtime dependency installation
        run: |
          python -m pip install --no-deps --dry-run -r "$RUNNER_TEMP/extra/scripts/remote-extended-requirements.txt"
      - name: Verify workflow, release and retry contracts
        run: >-
          python -B -m pytest tests/unit/test_offline_*.py tests/unit/test_remote_releases.py
          tests/unit/test_remote_schedule.py tests/unit/test_remote_paced_publication.py -q -p no:cacheprovider
      - name: Verify Core publication and recovery
        env:
          OFFLINE_RUNTIME_SOURCE: ${{ runner.temp }}/core
        run: python -B -m pytest tests/runtime/test_offline_*.py -q -p no:cacheprovider
      - name: Verify Extra queue and checkpoint recovery
        env:
          EXTRA_RUNTIME_SOURCE: ${{ runner.temp }}/extra
        run: python -B -m pytest tests/runtime/test_extra_*.py -q -p no:cacheprovider
