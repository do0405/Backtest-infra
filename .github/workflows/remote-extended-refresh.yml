name: Encrypted extra source refresh
on:
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: Bounded extra acquisition with encrypted checkpoint publication margin
        required: false
        default: '4800'
      audit_previous_sequence:
        description: Published checkpoint sequence to audit read-only with its successor
        required: false
  schedule:
    - cron: '37 0-22/2 * * *'
permissions:
  contents: read
concurrency:
  group: extra-us-coverage-read-only
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_previous_sequence == '761'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: backtest
          POSTGRES_PASSWORD: ephemeral-runner-only
          POSTGRES_DB: backtest_extra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backtest -d backtest_extra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Run exact extra runtime and encrypted private delivery
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          BACKTEST_DATABASE_URL: postgresql+psycopg://backtest:ephemeral-runner-only@localhost:5432/backtest_extra
          BACKTEST_CREDENTIALS_ENV_ONLY: '1'
          REMOTE_EXTENDED_OWNERSHIP: ${{ secrets.REMOTE_EXTENDED_OWNERSHIP_JSON }}
          REMOTE_EXTENDED_DELIVERY_KEY: ${{ secrets.REMOTE_EXTENDED_DELIVERY_KEY }}
          BUDGET_SECONDS: ${{ inputs.budget_seconds || '4800' }}
          EXTRA_AUDIT_PREVIOUS_SEQUENCE: ${{ inputs.audit_previous_sequence || '' }}
          EXTRA_US_AGGREGATE_AUDIT: 'true'
        run: |
          umask 077
          python scripts/remote_extended_launcher.py
