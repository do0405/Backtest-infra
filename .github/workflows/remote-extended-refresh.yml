name: Encrypted extra source refresh
on:
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: Bounded extra acquisition with encrypted checkpoint publication margin
        required: false
        default: '4800'
  schedule:
    - cron: '37 0-22/2 * * *'
permissions:
  contents: write
concurrency:
  group: encrypted-extra-source-forward-owner
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.REMOTE_EXTENDED_ENABLED == 'true' && vars.REMOTE_EXTENDED_PARTITIONS_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: backtest
          POSTGRES_PASSWORD: ephemeral-runner-only
          POSTGRES_DB: backtest_extra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backtest -d backtest_extra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Run exact extra runtime and encrypted private delivery
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          BACKTEST_DATABASE_URL: postgresql+psycopg://backtest:ephemeral-runner-only@localhost:5432/backtest_extra
          BACKTEST_CREDENTIALS_ENV_ONLY: '1'
          REMOTE_EXTENDED_OWNERSHIP: ${{ secrets.REMOTE_EXTENDED_OWNERSHIP_JSON }}
          REMOTE_EXTENDED_DELIVERY_KEY: ${{ secrets.REMOTE_EXTENDED_DELIVERY_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FSC_ISSUANCE_SERVICE_KEY: ${{ secrets.FSC_ISSUANCE_SERVICE_KEY }}
          FSC_RIGHTS_SERVICE_KEY: ${{ secrets.FSC_RIGHTS_SERVICE_KEY }}
          BUDGET_SECONDS: ${{ inputs.budget_seconds || '4800' }}
        run: |
          umask 077
          python scripts/remote_extended_launcher.py
