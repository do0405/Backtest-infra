name: Remote data update
on:
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: Bounded collection batch; next run resumes its checkpoint
        required: false
        default: '6000'
  schedule:
    - cron: '37 */2 * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: private-remote-source-account-owner
  cancel-in-progress: false
jobs:
  update:
    if: vars.REMOTE_PIPELINE_ENABLED == 'true' && vars.REMOTE_FREE_BUDGET_APPROVED == 'true' && vars.REMOTE_IDENTITY_HANDOFF_READY == 'true' && (github.event.repository.private == true || vars.REMOTE_DATA_PUBLIC_ALLOWED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: backtest
          POSTGRES_PASSWORD: ephemeral-runner-only
          POSTGRES_DB: backtest_remote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backtest -d backtest_remote"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BACKTEST_DATABASE_URL: postgresql+psycopg://backtest:ephemeral-runner-only@localhost:5432/backtest_remote
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REMOTE_OWNERSHIP: ${{ secrets.REMOTE_OWNERSHIP_JSON }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.13'
      - name: Install exact runtime without dependency resolution
        run: |
          python -m pip install --no-deps -r scripts/remote-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Apply schema in ephemeral PostgreSQL only
        run: python -m alembic upgrade head
      - name: Run bounded acquisition with explicitly transferred ownership
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          BATCH_SECONDS: ${{ inputs.budget_seconds || '6000' }}
        run: |
          umask 077
          python scripts/remote_release_cycle.py --work remote-work --budget-seconds "$BATCH_SECONDS"
