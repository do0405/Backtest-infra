name: Offline core refresh
on:
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: Bounded acquisition time with checkpoint export margin
        default: '5400'
        required: false
  schedule:
    - cron: '13 0-22/2 * * *'
permissions:
  contents: read
concurrency:
  group: offline-core-forward-owner
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && vars.OFFLINE_CORE_ENABLED == 'true' && vars.OFFLINE_QUOTA_PARTITIONS_READY == 'true' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    outputs:
      publication_state: ${{ steps.capture.outputs.publication_state }}
      source_index: ${{ steps.capture.outputs.source_index }}
      pending_cleanup: ${{ steps.capture.outputs.pending_cleanup }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Collect independently and publish durable checkpoint
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          OFFLINE_CONFIGURATION: ${{ secrets.OFFLINE_CORE_CONFIGURATION }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BUDGET_SECONDS: ${{ inputs.budget_seconds || '5400' }}
        run: python scripts/offline_runtime_launcher.py
      - name: Preserve pending delta if publication is deferred or interrupted
        if: always() && (steps.capture.outcome != 'success' || steps.capture.outputs.publication_state == 'deferred' || steps.capture.outputs.source_index == 'deferred' || steps.capture.outputs.pending_cleanup == 'deferred')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: offline-core-pending-v1-s${{ steps.capture.outputs.pending_sequence }}-h${{ steps.capture.outputs.pending_sha256 }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-isolated-runtime/capture/pending.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
  maintain:
    needs: refresh
    if: always() && needs.refresh.result != 'skipped'
    uses: ./.github/workflows/collection-maintenance.yml
    permissions:
      contents: write
      actions: read
    with:
      collection_outcome: ${{
        (needs.refresh.outputs.source_index == 'deferred' || needs.refresh.outputs.pending_cleanup == 'deferred') && 'committed_with_warnings'
        || needs.refresh.outputs.publication_state == 'deferred' && 'deferred'
        || needs.refresh.result }}
      core_publication_state: ${{ needs.refresh.outputs.publication_state }}
      core_source_index: ${{ needs.refresh.outputs.source_index }}
      core_pending_cleanup: ${{ needs.refresh.outputs.pending_cleanup }}
