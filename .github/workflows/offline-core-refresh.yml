name: Offline core refresh
on:
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: Bounded acquisition time with checkpoint export margin
        default: '5400'
        required: false
      qualify_sec:
        description: One bounded original-target SEC API qualification capture
        type: boolean
        default: false
        required: false
  schedule:
    - cron: '13 0-22/2 * * *'
  workflow_run:
    workflows: ['Remote data update']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: offline-core-forward-owner
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.OFFLINE_CORE_ENABLED == 'true' && vars.OFFLINE_QUOTA_PARTITIONS_READY == 'true' && github.event.repository.private == false && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Collect independently and publish durable checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          OFFLINE_CONFIGURATION: ${{ secrets.OFFLINE_CORE_CONFIGURATION }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BUDGET_SECONDS: ${{ inputs.budget_seconds || '5400' }}
          QUALIFY_SEC: ${{ inputs.qualify_sec && 'true' || 'false' }}
        run: python scripts/offline_runtime_launcher.py
  maintain:
    needs: refresh
    if: always() && vars.OFFLINE_CORE_ENABLED == 'true' && vars.OFFLINE_QUOTA_PARTITIONS_READY == 'true' && github.event.repository.private == false && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    concurrency:
      group: collection-health-owner
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Preserve repository health even after acquisition failure
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_OUTCOME: ${{ needs.refresh.result }}
          CORE_COLLECTION_ALLOWED: 'true'
          KRX_COLLECTION_ALLOWED: ${{ vars.REMOTE_PIPELINE_ENABLED == 'true' && vars.REMOTE_FREE_BUDGET_APPROVED == 'true' && vars.REMOTE_IDENTITY_HANDOFF_READY == 'true' && vars.REMOTE_DATA_PUBLIC_ALLOWED == 'true' && 'true' || 'false' }}
        run: python scripts/offline_workflow_maintenance.py
