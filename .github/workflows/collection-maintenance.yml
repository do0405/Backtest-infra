name: Collection maintenance
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      collection_outcome:
        type: string
        default: not_run
      core_publication_state:
        type: string
      core_source_index:
        type: string
      core_pending_cleanup:
        type: string
  schedule:
    - cron: '31 */4 * * *'
permissions:
  contents: read
jobs:
  maintain:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: collection-health-owner
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Record observed collection health
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_OUTCOME: ${{ inputs.collection_outcome || 'not_run' }}
          CORE_PUBLICATION_STATE: ${{ inputs.core_publication_state }}
          CORE_SOURCE_INDEX: ${{ inputs.core_source_index }}
          CORE_PENDING_CLEANUP: ${{ inputs.core_pending_cleanup }}
          CORE_COLLECTION_ALLOWED: ${{ vars.OFFLINE_CORE_ENABLED == 'true' && vars.OFFLINE_QUOTA_PARTITIONS_READY == 'true' && 'true' || 'false' }}
          KRX_COLLECTION_ALLOWED: ${{ vars.REMOTE_PIPELINE_ENABLED == 'true' && vars.REMOTE_FREE_BUDGET_APPROVED == 'true' && vars.REMOTE_IDENTITY_HANDOFF_READY == 'true' && vars.REMOTE_DATA_PUBLIC_ALLOWED == 'true' && 'true' || 'false' }}
          EXTRA_COLLECTION_ALLOWED: ${{ vars.REMOTE_EXTENDED_ENABLED == 'true' && vars.REMOTE_EXTENDED_PARTITIONS_READY == 'true' && vars.REMOTE_EXTENDED_AUTOMATIC_READY == 'true' && 'true' || 'false' }}
        run: python scripts/offline_workflow_maintenance.py
