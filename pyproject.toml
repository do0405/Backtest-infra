[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-data"
version = "0.1.0"
description = "Release-bound point-in-time US and Korean market datasets"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy==2.0.52",
  "alembic==1.19.1",
  "psycopg[binary]==3.3.4",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "tzdata==2026.2",
  "pypdf==6.11.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov>=6,<8"]
research = ["backtrader==1.9.78.123", "fastapi==0.136.1", "uvicorn==0.47.0", "numpy==2.1.3", "pandas==2.3.3"]

[project.scripts]
backtest-data = "backtest_data.cli:main"
backtest-research = "backtest_research.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a real PostgreSQL database", "live: explicitly enabled network tests"]
